[technology-description]
factory-connection-type-fluid=Låter dig transportera vätskor genom fabriksbyggnaden med rör, underjordiska rör och lagringstankar.\nHåll pekaren över anslutningspilen och tryck på R för att välja mellan inmatning, utmatning och balansering. Använd Shift+R och Ctrl+R för att ändra uppdateringsfrekvensen.
factory-connection-type-chest=Låter dig transportera föremål genom fabriksbyggnaden med kistor.\nHåll pekaren över anslutningspilen och tryck på R för att välja mellan inmatning, utmatning och balansering. Använd Shift+R och Ctrl+R för att ändra uppdateringsfrekvensen.
factory-connection-type-circuit=Låter dig ansluta kretsnätverket till fabriksbyggnaden med de två specialobjekt som låses upp av denna teknologi.\nAnvänd Shift+R och Ctrl+R för att ändra uppdateringsfrekvensen.\n\n[Observera: kretsanslutningar belastar spelets uppdateringar (UPS) ganska mycket. Använd inte för många och ställ inte in högre uppdateringsfrekvens än nödvändigt.]
factory-interior-upgrade-lights=Lägger till takbelysning i alla fabriker.\nSolpaneler producerar fortfarande ingen el inuti fabriker.
factory-interior-upgrade-display=Lägger till ett informationslager som visas i alt-läge på dina fabriker. Lägg föremål i styrenheterna inuti fabriken för att bestämma vad som visas på utsidan.
factory-preview=Håll pekaren över fabriksbyggnaderna för att se vad som finns inuti! Håll pekaren över fabrikens effektmätare för att se vad som finns utanför! Håll en fabriksbyggnad i handen för att se vad som finns inuti!\n\n[Problem? Se modinställningarna i spelet (Alternativ -> Moddar -> Per spelare)]
factory-requester-chest=Har dina upplockade fabriker försvunnit någonstans i logistiksystemet? Använd den här kistan för att automatiskt begära tillbaka dem.
factory-recursion-t1=Låter dig placera fabriksbyggnader inuti andra, större fabriksbyggnader.
factory-recursion-t2=Låter dig placera fabriksbyggnader inuti andra fabriksbyggnader av samma storlek.


[command-help-message]
give-lost-factory-buildings=Ger dig alla upplockade fabriksbyggnader som föremål, utom dem som redan finns i ditt förråd. Använd argumentet ”destroyed” för att även återställa förstörda fabriksbyggnader och få dem. Om du använder kommandot när fabriksföremålen egentligen inte är borta kan flera föremål i världen hänvisa till samma fabriksbyggnad. Dessa extra föremål försvinner med meddelandet ”Ogiltiga fabriksdata!” när de placeras.

