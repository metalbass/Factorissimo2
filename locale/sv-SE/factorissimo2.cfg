[mod-setting-description]
Factorissimo2-free-recursion=Låter dig bygga rekursiva fabriker även utan att ha forskat fram någon av rekursionsteknologierna.
Factorissimo2-hide-recursion=Döljer teknologierna Rekursion 1 och 2 så att de inte kan forskas fram.
Factorissimo2-better-recursion-2=Låter dig placera större fabriker inuti mindre när Rekursion 2 har forskats fram.
Factorissimo2-max-surfaces=Högsta antal ytor som Factorissimo2 ska skapa för fabrikernas insidor. Om du har fler fabriksbyggnader börjar Factorissimo2 återanvända tidigare ytor.
Factorissimo2-indestructible-buildings=Gör fabriksbyggnader immuna mot skador utifrån.
Factorissimo2-easy-research=Minskar kostnaden för all forskning i Factorissimo2.
Factorissimo2-power-batching=(Avancerat) Överför el var X:e uppdatering (jämnt fördelat mellan uppdateringarna). Kan minska belastningen på speluppdateringarna (UPS), men gör eldiagrammen ojämna om X > 1.
Factorissimo2-preview-enabled=Aktiverar förhandsvisningsfönstret som visas när du håller pekaren över en fabriksbyggnad eller dess effektmätare. Har du forskat fram funktionen ännu?
Factorissimo2-preview-size=Ställ in förhandsvisningsfönstrets storlek.
Factorissimo2-preview-zoom=Ställ in förhandsvisningsfönstrets zoomnivå om hela fabriksbyggnaden inte syns. Använd detta om gränssnittets skala är mindre än standardvärdet.


